name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    # Phase 12: ตรวจว่า production build ผ่านจริง (CI ก่อนหน้าเช็คแค่ type/lint/test)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build (production)
        run: npm run build
        env:
          # ค่าปลอมสำหรับ build — ไม่แตะฐานข้อมูลจริง
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/rune_dominion?schema=public'
          AUTH_SECRET: 'ci-build-secret-not-for-production'
          SERVER_PEPPER: 'ci-build-pepper-not-for-production'
          NODE_ENV: 'production'

      - name: ตรวจว่ารายการ build ครบ (build manifest)
        run: |
          test -f .next/BUILD_ID
          echo "BUILD_ID=$(cat .next/BUILD_ID)"
          test -d .next/server/app
          echo "✅ production build สำเร็จ"

  smoke:
    # Phase 12: ยก Postgres ชั่วคราว → push schema → start server → ตรวจ /api/health
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rune_dominion
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/rune_dominion?schema=public'

      - name: Start server
        run: |
          npm run build
          nohup npm run start > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/rune_dominion?schema=public'
          AUTH_SECRET: 'ci-smoke-secret-not-for-production'
          SERVER_PEPPER: 'ci-smoke-pepper-not-for-production'
          NODE_ENV: 'production'

      - name: Smoke test — /api/health ต้อง ok
        run: |
          set -e
          RESP="$(curl -s http://localhost:3000/api/health)"
          echo "$RESP"
          echo "$RESP" | grep -q '"status":"ok"'
          curl -s -o /dev/null -w 'หน้าแรก -> %{http_code}\n' http://localhost:3000/
          curl -si http://localhost:3000/api/health | grep -qi 'x-request-id'
          echo "✅ smoke test ผ่าน"

      - name: Seed ข้อมูลตั้งต้น (การ์ด + เควสต์) สำหรับ E2E
        run: npm run db:seed
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/rune_dominion?schema=public'

      - name: E2E critical flow (Discovery → Deck → Battle → Arena)
        run: npm run e2e:flow
        env:
          BASE_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/rune_dominion?schema=public'

      - name: แสดง log เมื่อล้มเหลว
        if: failure()
        run: tail -50 /tmp/next.log || true
